<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevion AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #040814;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.1);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.3);
        }

        .frozen-3d-ball {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(0, 136, 255, 0.6) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, #00f0ff 0%, #0044ff 60%, #020617 100%);
            box-shadow: 
                0 0 20px rgba(0, 240, 255, 0.4),
                inset -5px -5px 15px rgba(0, 136, 255, 0.7),
                inset 5px 5px 10px rgba(255, 255, 255, 0.4);
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .frozen-3d-ball::before {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%, rgba(0,240,255,0.2) 100%);
            filter: blur(1px);
        }

        .frozen-3d-ball::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
        }

        .logo-container:hover .frozen-3d-ball {
            transform: scale(1.08) rotate(25deg);
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.6),
                0 0 10px rgba(0, 136, 255, 0.4),
                inset -3px -3px 10px rgba(0, 136, 255, 0.5);
        }

        #sidebar {
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), padding 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .sidebar-collapsed {
            width: 88px !important;
        }

        .sidebar-collapsed .hide-on-collapse {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .sidebar-collapsed .center-on-collapse {
            justify-content: center;
            text-align: center;
        }

        .bg-aurora-glow {
            background: radial-gradient(circle at 50% -20%, #0c2042 0%, #050d21 45%, #040814 100%);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.03); }
        }

        .aurora-ambient-glow {
            position: absolute;
            top: 0;
            left: 25%;
            width: 50%;
            height: 45%;
            background: radial-gradient(100% 100% at 50% 0%, rgba(0, 240, 255, 0.12) 0%, rgba(0, 88, 255, 0.04) 50%, transparent 100%);
            filter: blur(60px);
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: floating 6s ease-in-out infinite;
        }

        .conversation-item {
            transition: all 0.2s ease;
        }
        .conversation-item:hover {
            background-color: rgba(15, 23, 42, 0.6);
        }
        .conversation-item.active {
            background-color: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
        }

        #contextMenu {
            position: absolute;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 180px;
            display: none;
            overflow: hidden;
        }
        #contextMenu button {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #contextMenu button:hover {
            background-color: #1e2937;
        }
    </style>
</head>
<body class="h-full text-slate-200 overflow-hidden flex">

    <div class="aurora-ambient-glow"></div>

    <button id="mobileMenuBtn" class="md:hidden fixed top-4 left-4 z-50 p-2.5 rounded-xl bg-slate-900/80 border border-cyan-500/20 text-slate-400 hover:text-cyan-400 backdrop-blur-md transition-colors">
        <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <aside id="sidebar" class="w-72 bg-[#060c1d] border-r border-cyan-500/10 flex flex-col p-5 z-40 shrink-0 duration-300 absolute md:relative h-full -translate-x-full md:translate-x-0">
        
        <div class="flex items-center justify-between h-12 mb-8 center-on-collapse">
            <div class="logo-container flex items-center gap-3">
                <div class="frozen-3d-ball"></div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent hide-on-collapse">Sevion</span>
            </div>
            <button id="collapseBtn" class="hide-on-collapse p-2 rounded-lg text-slate-500 hover:text-cyan-400 hover:bg-cyan-500/5 transition-all">
                <i data-lucide="chevrons-left" class="w-4 h-4"></i>
            </button>
            <button id="uncollapseBtn" class="hidden p-2 mx-auto rounded-lg text-slate-500 hover:text-cyan-400 hover:bg-cyan-500/5 transition-all">
                <i data-lucide="chevrons-right" class="w-4 h-4"></i>
            </button>
        </div>

        <button id="newChatBtn" class="flex items-center justify-center gap-2.5 bg-gradient-to-r from-blue-600/10 to-cyan-500/10 border border-cyan-500/20 hover:border-cyan-400/50 text-slate-200 py-3 px-4 rounded-xl font-medium transition-all duration-300 hover:shadow-[0_0_15px_rgba(0,240,255,0.15)] mb-6 center-on-collapse w-full">
            <i data-lucide="plus" class="w-4 h-4 text-cyan-400"></i>
            <span class="text-sm hide-on-collapse">New Chat</span>
        </button>

        <div class="flex-1 overflow-y-auto pr-1" id="conversationList">
            <div class="text-xs font-semibold tracking-wider text-slate-600 uppercase mb-3 px-3 hide-on-collapse">Recent Chats</div>
        </div>

        <!-- Logged in User -->
        <div class="pt-4 border-t border-cyan-500/5 flex items-center justify-between center-on-collapse">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-800 border border-cyan-500/20 flex items-center justify-center text-xs font-bold text-cyan-400 shrink-0">
                    {{ current_user.email[0].upper() }}
                </div>
                <div class="hide-on-collapse min-w-0">
                    <p class="text-xs font-semibold text-slate-300 truncate">{{ current_user.email }}</p>
                    <p class="text-[10px] text-slate-500 truncate">Free Plan</p>
                </div>
            </div>
            
            <a href="/logout" class="hide-on-collapse text-slate-500 hover:text-red-400 transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-aurora-glow h-full min-w-0">
        
        <div id="welcomeContainer" class="flex-1 flex items-center justify-center px-4 z-10 transition-all duration-500">
            <div class="animate-float max-w-lg w-full bg-slate-900/40 border border-cyan-500/15 backdrop-blur-2xl p-10 rounded-3xl text-center shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5),0_0_50px_rgba(0,240,255,0.03)]">
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-2 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Good afternoon</h1>
                <p class="text-sm md:text-base text-cyan-400/90 font-medium tracking-wide drop-shadow-[0_0_12px_rgba(0,240,255,0.3)]">What are we working on today?</p>
            </div>
        </div>

        <div id="chatView" class="hidden flex-1 overflow-y-auto px-4 md:px-8 pt-24 pb-8 space-y-6 max-w-4xl w-full mx-auto">
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-8 max-w-3xl w-full mx-auto z-20 relative">
            <div class="bg-slate-950/60 border border-cyan-500/15 focus-within:border-cyan-400/50 rounded-2xl p-3 flex items-end gap-3 backdrop-blur-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4),0_0_30px_rgba(0,240,255,0.02)] transition-all duration-300">
                
                <label class="p-2.5 rounded-xl text-slate-500 hover:text-cyan-400 hover:bg-cyan-500/5 transition-all shrink-0 cursor-pointer">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                    <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.csv,.png,.jpg,.jpeg,.webp">
                </label>

                <div class="flex-1">
                    <div id="filePreview" class="hidden mb-2 text-xs bg-slate-900 px-3 py-1 rounded-lg flex items-center gap-2 w-fit">
                        <span id="fileName" class="text-cyan-400"></span>
                        <button type="button" onclick="removeSelectedFile()" class="text-red-400 hover:text-red-500">×</button>
                    </div>

                    <textarea id="chatInput" rows="1" placeholder="Message Sevion..." 
                              class="w-full bg-transparent border-0 outline-none focus:ring-0 text-slate-200 placeholder-slate-500 text-base resize-none py-2 max-h-40 min-h-[24px] overflow-y-auto"></textarea>
                </div>

                <button id="sendBtn" class="p-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:shadow-[0_0_15px_#00f0ff] text-slate-950 flex items-center justify-center transition-all duration-300 disabled:opacity-40 shrink-0">
                    <i data-lucide="arrow-up" class="w-5 h-5 stroke-[2.5]"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Context Menu -->
    <div id="contextMenu" class="hidden bg-[#111827] border border-slate-700 rounded-xl shadow-2xl py-1 text-sm min-w-[180px]">
        <button id="deleteBtn" class="w-full px-4 py-3 text-left hover:bg-red-500/10 text-red-400 flex items-center gap-3 rounded-xl">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            <span>Delete Conversation</span>
        </button>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[200]">
        <div class="bg-[#0f172a] border border-slate-700 rounded-2xl w-full max-w-sm mx-4 p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center">
                    <i data-lucide="trash-2" class="w-5 h-5 text-red-400"></i>
                </div>
                <h3 class="text-lg font-semibold">Delete Conversation?</h3>
            </div>
            <p class="text-slate-400 text-sm mb-6">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button id="cancelDeleteBtn" class="flex-1 py-2.5 rounded-xl border border-slate-600 hover:bg-slate-800 transition-colors">Cancel</button>
                <button id="confirmDeleteBtn" class="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 transition-colors text-white">Delete</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const sidebar = document.getElementById('sidebar');
        const collapseBtn = document.getElementById('collapseBtn');
        const uncollapseBtn = document.getElementById('uncollapseBtn');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const welcomeContainer = document.getElementById('welcomeContainer');
        const chatView = document.getElementById('chatView');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const conversationList = document.getElementById('conversationList');
        const contextMenu = document.getElementById('contextMenu');
        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

        let isChatActive = false;
        let currentConversationId = null;
        let conversationToDelete = null;
        let selectedFile = null;

        // File Upload
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const fileNameSpan = document.getElementById('fileName');

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                selectedFile = this.files[0];
                fileNameSpan.textContent = selectedFile.name;
                filePreview.classList.remove('hidden');
            }
        });

        function removeSelectedFile() {
            selectedFile = null;
            fileInput.value = '';
            filePreview.classList.add('hidden');
        }

        // Sidebar Controls
        collapseBtn.addEventListener('click', () => {
            sidebar.classList.add('sidebar-collapsed');
            collapseBtn.classList.add('hidden');
            uncollapseBtn.classList.remove('hidden');
        });

        uncollapseBtn.addEventListener('click', () => {
            sidebar.classList.remove('sidebar-collapsed');
            uncollapseBtn.classList.add('hidden');
            collapseBtn.classList.remove('hidden');
        });

        mobileMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('-translate-x-full');
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth < 768 && !sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
                sidebar.classList.add('-translate-x-full');
            }
            contextMenu.style.display = 'none';
        });

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Context Menu Positioning
        function showContextMenu(e, convId) {
            e.preventDefault();
            const rect = sidebar.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            contextMenu.style.display = 'block';
            contextMenu.style.left = `${x + 10}px`;
            contextMenu.style.top = `${y}px`;
            conversationToDelete = convId;
        }

        async function loadConversations() {
            try {
                const response = await fetch('/conversations');
                const conversations = await response.json();
                
                conversationList.innerHTML = `<div class="text-xs font-semibold tracking-wider text-slate-600 uppercase mb-3 px-3 hide-on-collapse">Recent Chats</div>`;
                
                if (conversations.length === 0) {
                    conversationList.innerHTML += `<div class="px-3 py-2 text-xs text-slate-500 hide-on-collapse">No conversations yet</div>`;
                    return;
                }
                
                conversations.forEach(conv => {
                    const div = document.createElement('div');
                    div.className = `conversation-item flex items-center gap-3 p-3 rounded-xl hover:bg-slate-900/30 text-slate-200 border border-transparent transition-all cursor-pointer center-on-collapse group ${conv.id === currentConversationId ? 'active' : ''}`;
                    div.dataset.id = conv.id;
                    
                    div.innerHTML = `
                        <i data-lucide="message-square" class="w-4 h-4 text-cyan-500 shrink-0"></i>
                        <span class="text-sm truncate hide-on-collapse flex-1">${conv.title}</span>
                    `;
                    
                    div.addEventListener('click', () => loadConversation(conv.id));
                    div.addEventListener('contextmenu', (e) => showContextMenu(e, conv.id));
                    
                    conversationList.appendChild(div);
                });
                
                lucide.createIcons();
            } catch (err) {
                console.error('Failed to load conversations');
            }
        }

        async function loadConversation(convId) {
            try {
                const response = await fetch(`/conversation/${convId}`);
                const conv = await response.json();
                
                currentConversationId = convId;
                chatView.innerHTML = '';
                welcomeContainer.classList.add('hidden');
                chatView.classList.remove('hidden');
                isChatActive = true;
                
                conv.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
                loadConversations();
            } catch (err) {
                console.error('Failed to load conversation');
            }
        }

        function appendMessage(sender, text, shouldScroll = true) {
            if (!isChatActive) {
                welcomeContainer.classList.add('hidden');
                chatView.classList.remove('hidden');
                isChatActive = true;
            }

            const wrapper = document.createElement('div');
            wrapper.classList.add('w-full', 'flex', sender === 'user' ? 'justify-end' : 'justify-start');

            const bubble = document.createElement('div');
            if (sender === 'user') {
                bubble.className = "max-w-[75%] bg-gradient-to-br from-blue-600 via-blue-600 to-cyan-500 text-white rounded-2xl rounded-br-sm py-3 px-4 shadow-[0_4px_15px_rgba(0,136,255,0.25)] text-sm md:text-base leading-relaxed";
            } else {
                bubble.className = "max-w-[75%] bg-slate-900/50 border border-cyan-500/5 shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] text-slate-200 rounded-2xl rounded-bl-sm py-3 px-4 text-sm md:text-base leading-relaxed backdrop-blur-md";
            }
            
            bubble.innerText = text;
            wrapper.appendChild(bubble);
            chatView.appendChild(wrapper);

            if (shouldScroll) chatView.scrollTop = chatView.scrollHeight;
        }

        // ==================== UPDATED SEND MESSAGE ====================
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text && !selectedFile) return;

            if (selectedFile) appendMessage('user', `[Uploaded: ${selectedFile.name}]`);
            if (text) appendMessage('user', text);

            const formData = new FormData();
            formData.append("message", text);
            if (currentConversationId) formData.append("conversation_id", currentConversationId);
            if (selectedFile) formData.append("file", selectedFile);

            chatInput.value = '';
            chatInput.style.height = 'auto';
            removeSelectedFile();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error === "token_limit") {
                    appendMessage('bot', data.message);
                    chatInput.disabled = true;
                    sendBtn.disabled = true;
                } else if (data.error) {
                    appendMessage('bot', data.message || "Sorry, I'm having trouble responding right now.");
                } else {
                    appendMessage('bot', data.reply);
                    if (data.conversation_id && !currentConversationId) {
                        currentConversationId = data.conversation_id;
                    }
                    loadConversations();
                }
            } catch (err) {
                appendMessage('bot', "Sorry, I'm having trouble responding right now.");
            }
        }

        async function deleteConversation(convId) {
            try {
                const response = await fetch(`/conversation/${convId}`, { method: 'DELETE' });
                if (response.ok) {
                    if (currentConversationId === convId) {
                        chatView.innerHTML = '';
                        chatView.classList.add('hidden');
                        welcomeContainer.classList.remove('hidden');
                        currentConversationId = null;
                        isChatActive = false;
                    }
                    loadConversations();
                }
            } catch (err) {
                console.error('Failed to delete conversation');
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newChatBtn.addEventListener('click', () => {
            chatView.innerHTML = '';
            chatView.classList.add('hidden');
            welcomeContainer.classList.remove('hidden');
            isChatActive = false;
            currentConversationId = null;
            removeSelectedFile();
            chatInput.disabled = false;
            sendBtn.disabled = false;
        });

        document.getElementById('deleteBtn').addEventListener('click', () => {
            contextMenu.style.display = 'none';
            if (conversationToDelete) {
                deleteModal.classList.remove('hidden');
                deleteModal.classList.add('flex');
            }
        });

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.remove('flex');
            deleteModal.classList.add('hidden');
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            deleteModal.classList.remove('flex');
            deleteModal.classList.add('hidden');
            if (conversationToDelete) {
                await deleteConversation(conversationToDelete);
                conversationToDelete = null;
            }
        });

        window.onload = function() {
            loadConversations();
        };
    </script>
</body>
</html>
