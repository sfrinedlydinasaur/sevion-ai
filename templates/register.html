<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevion • Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#0a0a0a]">
    <div class="w-full max-w-md px-6">
        
        <div class="flex items-center gap-3 mb-10">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                <span class="text-white font-bold text-2xl">S</span>
            </div>
            <span class="text-3xl font-semibold tracking-tight">Sevion</span>
        </div>

        <h1 class="text-4xl font-semibold tracking-tight mb-2">Create your account</h1>
        <p class="text-slate-400 mb-8">Start building with Sevion today</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-xl {% if category == 'error' %}bg-red-500/10 text-red-400{% else %}bg-green-500/10 text-green-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm mb-1.5 text-slate-400">Email</label>
                <input type="email" name="email" required 
                       class="w-full bg-[#111827] border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-sm mb-1.5 text-slate-400">Password</label>
                <input type="password" name="password" required 
                       class="w-full bg-[#111827] border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 mt-2 rounded-2xl bg-white text-black font-semibold hover:bg-slate-200 transition-colors">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account? 
            <a href="/" class="text-cyan-400 hover:underline">Log in</a>
        </p>
    </div>
</body>
</html>
